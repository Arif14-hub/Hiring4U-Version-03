spring.application.name=Hiring4U
spring.profiles.default=mysql

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_portal}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD: Arif12@1}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8082}
server.shutdown=graceful

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.health.db.enabled=true

info.app.name=Hiring4U Job Service
info.app.description=Job portal API for candidates and recruiters
info.app.version=${APP_VERSION:dev}

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.password-reset.delivery=${PASSWORD_RESET_DELIVERY:browser}
app.password-reset.from=${MAIL_FROM:no-reply@hiring4u.local}
app.password-reset.token-ttl-minutes=${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
