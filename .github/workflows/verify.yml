name: Verify job service

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw verify
      - run: docker build --tag hiring4u-job-service:${{ github.sha }} .
